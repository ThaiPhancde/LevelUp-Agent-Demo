name: levelup-vmm-demo
services:
  demo:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - demo_data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  demo_data:
